version: '1.0'
metadata:
  title: Antigravity CLI Field Workshop
  subtitle: 'Exercise 12: ADK Agent Lifecycle with agents-cli'
  output: docs/assets/videos/ex12_agents_cli_lifecycle.mp4
  poster_output: docs/assets/videos/ex12_poster.png
  resolution:
  - 1280
  - 720
  fps: 25
  theme: catppuccin-mocha
  statusbar_left: 'Antigravity CLI | Ex 12: agents-cli Lifecycle'
  statusbar_right: TermReel HD

environment:
  auto_trust: true
  setup_commands:
    - python3 /tmp/stage_ex12.py
    - rm -rf /tmp/meeting-notes-workspace && mkdir -p /tmp/meeting-notes-workspace

permissions:
  auto_approve: true

triggers:
- on_match: Do you trust the contents of this project\?|Yes, I trust
  action: Enter
  once: true
- on_match: \[y/N\]|Apply changes\?|Approve\?|Press Enter to continue
  action:
    type: send_key
    value: y
    delay_before: 0.5
  once: false

timeline:
- show_card:
    tag: Exercise 12
    title: ADK Agent Lifecycle with agents-cli (45 min)
    desc: Scaffold, build tools, write eval suite, and execute eval-fix comparison
    duration: 2.5

# Part 1: Scaffold
- show_card:
    tag: Part 1
    title: Scaffold the Agent (10 min)
    desc: Create prototype meeting-notes agent with GEMINI.md guidance
    duration: 2.0

- launch:
    command: bash
    wait_for_prompt: true

- type:
    text: cd /tmp/meeting-notes-workspace && agents-cli scaffold create meeting-notes --agent adk --prototype --agent-guidance-filename GEMINI.md
    speed: 0.035
    send_key: Enter

- pause: 2.5

- type:
    text: cd meeting-notes && ls -la
    speed: 0.035
    send_key: Enter

- pause: 2.0

- type:
    text: cp -r /tmp/staged_meeting_notes/* .
    speed: 0.035
    send_key: Enter

- pause: 1.5

# Part 2: Build the Agent
- show_card:
    tag: Part 2
    title: Build the Agent (15 min)
    desc: Inspect format_summary tool, root_agent, and run live smoke test
    duration: 2.0

- type:
    text: head -n 25 app/tools.py
    speed: 0.035
    send_key: Enter

- pause: 2.5

- type:
    text: head -n 25 app/agent.py
    speed: 0.035
    send_key: Enter

- pause: 2.5

- type:
    text: 'agents-cli run "Summarize this meeting: Alice and Bob discussed the Q3 launch. Alice will prepare the marketing deck by Friday. Bob will review the API docs by next Monday. They decided to use Cloud Run for deployment."'
    speed: 0.035
    send_key: Enter

- pause: 4.5

# Part 3: Write Eval Cases
- show_card:
    tag: Part 3
    title: Write Eval Cases & Metrics (10 min)
    desc: Author basic-dataset.json transcripts and custom meeting_summary_quality metric
    duration: 2.0

- type:
    text: cat tests/eval/eval_config.yaml
    speed: 0.035
    send_key: Enter

- pause: 2.5

- type:
    text: head -n 25 tests/eval/datasets/basic-dataset.json
    speed: 0.035
    send_key: Enter

- pause: 2.5

- type:
    text: agents-cli eval generate --help
    speed: 0.035
    send_key: Enter

- pause: 2.0

- type:
    text: agents-cli eval grade --help
    speed: 0.035
    send_key: Enter

- pause: 2.0

# Part 4: Eval-Fix Loop & Benchmark Comparison
- show_card:
    tag: Part 4
    title: The Eval-Fix Loop & Comparison (10 min)
    desc: Inspect grade results and compare candidate metrics against baseline
    duration: 2.0

- type:
    text: cat artifacts/grade_results/baseline.json
    speed: 0.035
    send_key: Enter

- pause: 2.0

- type:
    text: cat artifacts/grade_results/results_fixed.json
    speed: 0.035
    send_key: Enter

- pause: 2.0

- type:
    text: agents-cli eval compare artifacts/grade_results/baseline.json artifacts/grade_results/results_fixed.json
    speed: 0.035
    send_key: Enter

- pause: 3.5

# Part 5: Project Info & Summary
- show_card:
    tag: Part 5
    title: Project Info & Completion Verification
    desc: Verify unified agents-cli project state and metadata
    duration: 2.0

- type:
    text: agents-cli info
    speed: 0.035
    send_key: Enter

- pause: 2.5

- show_card:
    tag: Complete
    title: Exercise 12 Verified
    desc: ADK Agent scaffolded, built, evaluated, and verified across all lifecycle milestones
    duration: 2.5
